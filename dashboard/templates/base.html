<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Content Pipeline{% endblock %}</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg2: #161b22;
            --bg3: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --text2: #8b949e;
            --accent: #58a6ff;
            --green: #3fb950;
            --orange: #d29922;
            --red: #f85149;
            --purple: #bc8cff;
            --pink: #ff7b72;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        /* Layout */
        .app { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px; background: var(--bg2);
            border-right: 1px solid var(--border);
            padding: 16px; flex-shrink: 0;
        }
        .sidebar h1 {
            font-size: 18px; margin-bottom: 24px;
            display: flex; align-items: center; gap: 8px;
        }
        .sidebar h1 span { color: var(--accent); }
        .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
        .sidebar nav a {
            padding: 10px 12px; border-radius: 8px;
            color: var(--text2); text-decoration: none;
            display: flex; align-items: center; gap: 10px;
            font-size: 14px; transition: 0.15s;
        }
        .sidebar nav a:hover, .sidebar nav a.active {
            background: var(--bg3); color: var(--text);
        }
        .sidebar nav a.active { color: var(--accent); font-weight: 600; }
        .main { flex: 1; padding: 24px 32px; overflow-y: auto; }
        .main h2 { font-size: 22px; margin-bottom: 16px; }
        /* Cards */
        .card {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 10px; padding: 20px; margin-bottom: 16px;
        }
        .card h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); }
        .card .meta { font-size: 13px; color: var(--text2); }
        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        /* Status badges */
        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 600;
        }
        .badge-healthy { background: #0d3b0d; color: var(--green); }
        .badge-down { background: #3b0d0d; color: var(--red); }
        .badge-degraded { background: #3b2e0d; color: var(--orange); }
        .badge-info { background: #0d1d3b; color: var(--accent); }
        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 10px 12px; background: var(--bg3); color: var(--text2); font-weight: 600; border-bottom: 1px solid var(--border); }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: var(--bg3); }
        /* Forms */
        input, select, textarea {
            background: var(--bg3); border: 1px solid var(--border);
            color: var(--text); padding: 8px 12px; border-radius: 8px;
            font-size: 14px; width: 100%; outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }
        label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 4px; }
        .form-group { margin-bottom: 16px; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg3); color: var(--text); cursor: pointer;
            font-size: 14px; transition: 0.15s; text-decoration: none;
        }
        .btn:hover { background: var(--border); }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-primary:hover { opacity: 0.9; }
        .btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .flex { display: flex; gap: 12px; align-items: center; }
        .flex-wrap { flex-wrap: wrap; }
        .gap-2 { gap: 8px; }
        .mt-2 { margin-top: 12px; }
        .mb-2 { margin-bottom: 12px; }
        .text-muted { color: var(--text2); font-size: 13px; }
        .text-green { color: var(--green); }
        .text-red { color: var(--red); }
        .text-accent { color: var(--accent); }
        .text-center { text-align: center; }
        .mb-0 { margin-bottom: 0; }
        /* Loading */
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid var(--border); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* Status bar */
        .status-bar {
            display: flex; gap: 16px; padding: 12px 0;
            border-bottom: 1px solid var(--border); margin-bottom: 20px;
        }
        .status-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.green { background: var(--green); }
        .status-dot.red { background: var(--red); }
        .status-dot.orange { background: var(--orange); }
        /* Pre/code */
        pre {
            background: var(--bg); padding: 12px; border-radius: 8px;
            border: 1px solid var(--border); overflow-x: auto;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 13px; line-height: 1.5;
        }
        /* Search */
        .search-bar {
            display: flex; gap: 8px; margin-bottom: 16px;
        }
        .search-bar input { flex: 1; }
        /* Tabs */
        .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .tab {
            padding: 10px 20px; cursor: pointer; border-bottom: 2px solid transparent;
            color: var(--text2); font-size: 14px; transition: 0.15s;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 60px; padding: 12px 8px; }
            .sidebar h1 span { display: none; }
            .sidebar nav a span { display: none; }
            .main { padding: 16px; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h1><span>◆</span> <span>Pipeline</span></h1>
        <nav>
            <a href="/" class="{% if request.url and request.url.path == '/' %}active{% endif %}">
                <span>📊</span> <span>Dashboard</span>
            </a>
            <a href="/create" class="{% if request.url.path.startswith('/create') %}active{% endif %}">
                <span>⚡</span> <span>Create</span>
            </a>
            <a href="/distribute" class="{% if request.url.path.startswith('/distribute') %}active{% endif %}">
                <span>🚀</span> <span>Distribute</span>
            </a>
            <a href="/models" class="{% if request.url.path.startswith('/models') %}active{% endif %}" hx-get="/models" hx-target="body" hx-push-url="true">
                <span>🧠</span> <span>Models</span>
            </a>
            <a href="/lora" class="{% if request.url.path.startswith('/lora') %}active{% endif %}" hx-get="/lora" hx-target="body" hx-push-url="true">
                <span>🎨</span> <span>LoRAs</span>
            </a>
            <a href="/comfyui" class="{% if request.url.path.startswith('/comfyui') %}active{% endif %}" hx-get="/comfyui" hx-target="body" hx-push-url="true">
                <span>⚙️</span> <span>ComfyUI</span>
            </a>
            <a href="/grok" class="{% if request.url.path.startswith('/grok') %}active{% endif %}" hx-get="/grok" hx-target="body" hx-push-url="true">
                <span>🤖</span> <span>Grok</span>
            </a>
            <a href="/workflows" class="{% if request.url.path.startswith('/workflows') %}active{% endif %}" hx-get="/workflows" hx-target="body" hx-push-url="true">
                <span>🔗</span> <span>Workflows</span>
            </a>
            <a href="/gpu" class="{% if request.url.path.startswith('/gpu') %}active{% endif %}" hx-get="/gpu" hx-target="body" hx-push-url="true">
                <span>🖥</span> <span>GPU</span>
            </a>
            <a href="/outputs" class="{% if request.url.path.startswith('/outputs') %}active{% endif %}" hx-get="/outputs" hx-target="body" hx-push-url="true">
                <span>🖼</span> <span>Outputs</span>
            </a>
        </nav>
    </aside>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
</div>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script>
    // Tab switching
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('tab')) {
            const container = e.target.closest('[data-tabs]');
            if (!container) return;
            const tabs = container.querySelectorAll('.tab');
            const contents = container.querySelectorAll('.tab-content');
            tabs.forEach(t => t.classList.remove('active'));
            contents.forEach(c => c.classList.remove('active'));
            e.target.classList.add('active');
            const target = document.getElementById(e.target.dataset.tab);
            if (target) target.classList.add('active');
        }
    });
</script>
</body>
</html>
